# Weekly USDA refresh for the index-reset pricing backtest.
# Place this file in the repo at: .github/workflows/refresh.yml
# Runs on GitHub's servers; nothing executes on your machine.

name: usda-refresh

on:
  schedule:
    - cron: "30 0 * * 3"   # Wed 00:30 UTC = Tuesday evening US Central, after the issue posts
  workflow_dispatch: {}      # adds a manual Run workflow button for testing

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull USDA series and rebuild usda_data.js
        env:
          MARS_API_KEY: ${{ secrets.MARS_API_KEY }}
        run: python usda_refresh.py

      - name: Commit refreshed data
        run: |
          git config user.name "usda-refresh"
          git config user.email "actions@users.noreply.github.com"
          git add usda_data.js
          git diff --cached --quiet || git commit -m "weekly USDA refresh"
          git push
