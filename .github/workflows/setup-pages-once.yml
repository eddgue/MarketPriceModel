# Temporary helper: enables GitHub Pages (deploy-from-branch) via the API,
# because this deploy session has no admin UI access. Safe to delete after
# the first successful run; it never runs on a schedule.

name: setup-pages-once

on:
  workflow_dispatch: {}

permissions:
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Create Pages site, deploy from branch, root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"build_type":"legacy","source":{"branch":"claude/peaceful-darwin-hr8g40","path":"/"}}' \
            -o /tmp/resp.json -w "HTTP %{http_code}\n"
          cat /tmp/resp.json
